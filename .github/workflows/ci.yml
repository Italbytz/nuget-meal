name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  schedule:
    - cron: '0 5 * * 1-5'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore nuget-meal.sln

      - name: Build solution
        run: dotnet build nuget-meal.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test nuget-meal.sln --configuration Release --no-build --verbosity minimal

      - name: Pack packages
        run: dotnet pack nuget-meal.sln --configuration Release --no-build --verbosity minimal --output ./artifacts/packages

      - name: Build docfx site
        run: dotnet tool run docfx docfx/docfx.json

      - name: Restore Blazor sample
        run: dotnet restore samples/Italbytz.Meal.STWPB.Blazor.Sample/Italbytz.Meal.STWPB.Blazor.Sample.csproj

      - name: Build STWPB sample snapshot
        run: dotnet run --project samples/Italbytz.Meal.STWPB.SampleDataBuilder/Italbytz.Meal.STWPB.SampleDataBuilder.csproj -- samples/Italbytz.Meal.STWPB.Blazor.Sample/wwwroot/data/hamm-meals.json

      - name: Publish Blazor sample
        run: dotnet publish samples/Italbytz.Meal.STWPB.Blazor.Sample/Italbytz.Meal.STWPB.Blazor.Sample.csproj --configuration Release --output ./artifacts/sample-build

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Publish NuGet packages
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && env.NUGET_API_KEY != ''
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish NuGet symbol packages
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && env.NUGET_API_KEY != ''
        run: dotnet nuget push artifacts/packages/*.snupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ./artifacts/pages/sample
          perl -0pi -e 's#<base href="/" />#<base href="/nuget-meal/sample/" />#' ./artifacts/sample-build/wwwroot/index.html
          cp ./artifacts/sample-build/wwwroot/index.html ./artifacts/sample-build/wwwroot/404.html
          cp -R ./docfx/_site/. ./artifacts/pages
          cp -R ./artifacts/sample-build/wwwroot/. ./artifacts/pages/sample
          touch ./artifacts/pages/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./artifacts/pages

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-test-pack
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
